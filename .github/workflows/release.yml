name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status completed --limit 20 --json conclusion,event,headBranch --jq 'map(select(.conclusion=="success" and .event=="push" and .headBranch=="main")) | length')"
          test "$passed" -gt 0 || { echo "CI has not passed for $GITHUB_SHA on main"; exit 1; }
      - id: build-java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: microsoft
          java-version: '17'
      - uses: gradle/actions/setup-gradle@346a44564f803579f2a9d82d6570fa5c56d80eff
      - name: Build the locked release JAR
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          LOCKED_CANDIDATE_ROOT: ${{ runner.temp }}/svg2vd-locked-candidate
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          JAVA_HOME="${{ steps.build-java.outputs.path }}" ./gradlew :upstream-sync:discoverLockedCandidate \
            -PcorpusLock="$GITHUB_WORKSPACE/corpus.lock.json" \
            -PcandidateOutputDirectory="$LOCKED_CANDIDATE_ROOT" \
            --dependency-verification strict
          candidate_manifest="$(find "$LOCKED_CANDIDATE_ROOT" -maxdepth 1 -type f -name '*.json' -print -quit)"
          test -n "$candidate_manifest"
          JAVA_HOME="${{ steps.build-java.outputs.path }}" ./gradlew :cli:shadowJar \
            -PcandidateManifest="$candidate_manifest" \
            -Psvg2vdVersion="$version" \
            --dependency-verification strict
          upstream_tag="$(jq -r '.tag.name' "$candidate_manifest")"
          upstream_version="${upstream_tag#studio-}"
          jar="cli/build/libs/svg2vd-${version}-all.jar"
          release_jar="svg2vd-${version}-studio-${upstream_version}-all.jar"
          cp "$jar" "$release_jar"
          jar_sha="$(sha256sum "$release_jar" | awk '{print $1}')"
          lock_sha="$(sha256sum corpus.lock.json | awk '{print $1}')"
          engine_fingerprint="$(jq -r '.engine_fingerprint' "$candidate_manifest")"
          peeled_commit="$(jq -r '.tag.peeled_commit' "$candidate_manifest")"
          printf '%s  %s\n' "$jar_sha" "$release_jar" > SHA256SUMS
          jq -n --sort-keys \
            --arg schema_version "1" \
            --arg tool_version "$version" \
            --arg tool_source_commit "$GITHUB_SHA" \
            --arg upstream_tag "$upstream_tag" \
            --arg upstream_commit "$peeled_commit" \
            --arg engine_fingerprint "$engine_fingerprint" \
            --arg corpus_lock_sha256 "$lock_sha" \
            --arg artifact_name "$release_jar" \
            --arg artifact_sha256 "$jar_sha" \
            '{schema_version:($schema_version|tonumber), tool_version:$tool_version, tool_source_commit:$tool_source_commit, upstream_tag:$upstream_tag, upstream_commit:$upstream_commit, engine_fingerprint:$engine_fingerprint, corpus_lock_sha256:$corpus_lock_sha256, artifacts:[{name:$artifact_name,sha256:$artifact_sha256}]}' > provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle-${{ github.ref_name }}
          path: |
            svg2vd-*-all.jar
            SHA256SUMS
            provenance.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle-${{ github.ref_name }}
          path: release-bundle
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$tag" --pattern SHA256SUMS --pattern provenance.json --dir "$existing" --clobber
            cmp -- release-bundle/SHA256SUMS "$existing/SHA256SUMS"
            cmp -- release-bundle/provenance.json "$existing/provenance.json"
            artifact="$(jq -r '.artifacts[0].name' release-bundle/provenance.json)"
            gh release download "$tag" --pattern "$artifact" --dir "$existing" --clobber
            expected="$(jq -r --arg name "$artifact" '.artifacts[] | select(.name == $name) | .sha256' release-bundle/provenance.json)"
            actual="$(sha256sum "$existing/$artifact" | awk '{print $1}')"
            test "$expected" = "$actual"
            exit 0
          fi
          gh release create "$tag" --verify-tag --generate-notes release-bundle/svg2vd-*-all.jar release-bundle/SHA256SUMS release-bundle/provenance.json
