name: Upstream Visual Corpus

on:
  workflow_call:
    inputs:
      candidate_artifact:
        description: Artifact containing an immutable candidate manifest, matching materials sidecar, and corpus.lock.json.
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-visual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: build-java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: microsoft
          java-version: '17'
      - uses: gradle/actions/setup-gradle@346a44564f803579f2a9d82d6570fa5c56d80eff
      - id: java11
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: microsoft
          java-version: '11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact }}
          path: ${{ runner.temp }}/svg2vd-candidate-manifest-and-materials
      - name: Materialize exact candidate and run the strict visual gate
        env:
          JAVA_11_EXECUTABLE: ${{ steps.java11.outputs.path }}/bin/java
        shell: bash
        run: |
          CANDIDATE_ROOT="${RUNNER_TEMP}/svg2vd-candidate-manifest-and-materials"
          CORPUS_ROOT="${RUNNER_TEMP}/svg2vd-upstream-corpus"
          LOCK_PATH="$CANDIDATE_ROOT/corpus.lock.json"
          test -f "$LOCK_PATH"
          cmp -- "$GITHUB_WORKSPACE/corpus.lock.json" "$LOCK_PATH"
          CANDIDATE_MANIFEST="$(find "$CANDIDATE_ROOT" -maxdepth 1 -type f -name '*.json' ! -name corpus.lock.json -print -quit)"
          test -n "$CANDIDATE_MANIFEST"
          test -d "${CANDIDATE_MANIFEST%.json}.materials"
          JAVA_HOME="${{ steps.build-java.outputs.path }}" ./gradlew :upstream-sync:syncCorpus \
            -PcandidateManifest="$CANDIDATE_MANIFEST" \
            -PcorpusOutputDirectory="$CORPUS_ROOT" \
            --dependency-verification strict
          CORPUS_MANIFEST="$(find "$CORPUS_ROOT" -name manifest.json -print -quit)"
          test -n "$CORPUS_MANIFEST"
          test "$(shasum -a 256 "$CORPUS_MANIFEST" | awk '{print $1}')" = "$(jq -r .corpus_manifest_sha256 "$LOCK_PATH")"
          JAVA_HOME="${{ steps.build-java.outputs.path }}" ./gradlew :upstream-sync:test :engine:test :cli:test :cli:shadowJar :verification:corpusTest \
            -PcandidateManifest="$CANDIDATE_MANIFEST" \
            -PcorpusManifest="$CORPUS_MANIFEST" \
            -PcorpusRoot="$(dirname "$CORPUS_MANIFEST")" \
            -Psvg2vdJar="$GITHUB_WORKSPACE/cli/build/libs/svg2vd-0.1.0-all.jar" \
            -PjavaExecutable="$JAVA_11_EXECUTABLE" \
            --dependency-verification strict --rerun-tasks --no-build-cache
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-visual-corpus-artifacts
          path: |
            verification/build/corpus-artifacts
            ${{ runner.temp }}/svg2vd-candidate-manifest-and-materials
            ${{ runner.temp }}/svg2vd-upstream-corpus
          if-no-files-found: ignore
